#planner:
yaw_offset: 2 # degree -2.5  yaw_offset/pitch 是枪管当前朝向
pitch_offset: 6.5 # degree 2 pitch_offset/pitch 是枪管当前朝向
fire_thresh: 0.0035
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s
low_speed_delay_time: 0.0 # s planner use this value
max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]
max_pitch_acc: 100
Q_pitch: [9e6, 0]
R_pitch: [1]

#shooter:
low_speed_delay_time_shooter: 0.0 # s
high_speed_delay_time_shooter: 0.0 # s
decision_v_speed_shooter: 5 # m/s


#----------------Solver------------:
# 相机内参矩阵 (Camera Matrix) 按行展开 3x3
camera_matrix: [2328.685719898089, 0, 733.3564625092474,
            0, 2328.670107789996, 540.6187286922773,
            0, 0, 1]

# 畸变系数 k1, k2, p1, p2, k3
distortion_coeffs: [-0.09182103918709904,
            0.4639907346830205,
            0.002609878642637282,
            0.0009819586010405485,
            -0.4751278850310457]

# 相机到云台的旋转矩阵 按行展开 3x3
R_Cam_to_gripper: [-0.009549480539577278, -0.01953893000739315, 0.9997634908495061,
            -0.9999090215267193, -0.009338627954961053, -0.009733380573965271,
            0.009526599125766769, -0.9997654826218425, -0.01944797333944928]

# 相机到云台的平移向量 单位：cm
T_Cam_to_gripper: [13.6068364765315,
            -4.186176466382783,
            0.8995665883635868]

# 重投影误差阈值
reproj_threshold: 2


#---------------CVDetector--------:
# CVDetector::CVDetectorConfig
color: 1         # Red = 0, Blue = 1
roi_width: 32
roi_height: 32


#---------------HikCamera---------:
# io::HikCamera::HikCameraConfig
exposure_ms: 1        # 曝光时间 单位：ms
gain: 10              # 增益
autocap: true         # true: 自由采集; false: 外部硬件触发
IsFlip: true          # true: 相机倒放翻转回来

#---------------RTSerial----------:
# io::RTSerial::RTSerialConfig
buffSize: 50          # 环形缓冲区大小
head: 0xA5            # 包头字节
